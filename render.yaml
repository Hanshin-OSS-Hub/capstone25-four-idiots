services:
  - type: web
    name: math-arena-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_OFF
        value: "false"
      - key: PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: REDIS_URL
        sync: false
