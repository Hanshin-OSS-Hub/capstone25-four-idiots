<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 60px; font-weight: 800; fill: #172033; }
      .subtitle { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 27px; font-weight: 500; fill: #5c667a; }
      .step-num { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
      .step-title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 31px; font-weight: 800; fill: #172033; }
      .flow-title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 27px; font-weight: 800; fill: #172033; }
      .body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 23px; font-weight: 500; fill: #404b63; }
      .body-small { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 21px; font-weight: 500; fill: #404b63; }
      .small { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 20px; font-weight: 500; fill: #5c667a; }
      .result-title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 33px; font-weight: 800; fill: #ffffff; }
      .result-body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 23px; font-weight: 600; fill: #eaf2ff; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2454c6"/>
      <stop offset="100%" stop-color="#0f7d8a"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f5f8fc"/>
  <rect x="0" y="0" width="1920" height="220" fill="url(#headerGrad)"/>

  <text x="110" y="112" class="title">백엔드 서버 구축 과정</text>
  <text x="112" y="163" class="subtitle">Unity 클라이언트와 Aiven MySQL 사이에서 게임 데이터를 처리하는 서버 구현 흐름</text>

  <g transform="translate(112,250)">
    <rect x="0" y="0" width="1040" height="98" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="52" y="61" class="flow-title">Unity 클라이언트</text>
    <path d="M305 49 H430" stroke="#93a4ba" stroke-width="5" stroke-linecap="round"/>
    <path d="M430 49 l-16 -10 v20 z" fill="#93a4ba"/>
    <text x="470" y="61" class="flow-title">Flask 서버(Render)</text>
    <path d="M760 49 H875" stroke="#93a4ba" stroke-width="5" stroke-linecap="round"/>
    <path d="M875 49 l-16 -10 v20 z" fill="#93a4ba"/>
    <text x="910" y="61" class="flow-title">Aiven MySQL</text>
  </g>

  <g transform="translate(112,405)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="360" height="245" rx="18" fill="#ffffff"/>
      <circle cx="45" cy="48" r="24" fill="#2563eb"/>
      <text x="37" y="57" class="step-num">1</text>
      <text x="86" y="58" class="step-title">기본 구축</text>
      <text x="34" y="116" class="body">Flask 서버 구성</text>
      <text x="34" y="157" class="body">Docker 기반 Render 배포</text>
      <text x="34" y="198" class="body">Aiven MySQL 연결</text>
    </g>

    <path d="M385 122 H455" stroke="#9aa9bd" stroke-width="6" stroke-linecap="round"/>
    <path d="M455 122 l-18 -12 v24 z" fill="#9aa9bd"/>

    <g transform="translate(485,0)" filter="url(#shadow)">
      <rect x="0" y="0" width="360" height="245" rx="18" fill="#ffffff"/>
      <circle cx="45" cy="48" r="24" fill="#0f8a7a"/>
      <text x="37" y="57" class="step-num">2</text>
      <text x="86" y="58" class="step-title">기능 구현</text>
      <text x="34" y="116" class="body">로그인 / 사용자 확인</text>
      <text x="34" y="157" class="body">문제 조회 / 정답 판정</text>
      <text x="34" y="198" class="body">훈련 기록 / 아레나 매칭</text>
    </g>

    <path d="M870 122 H940" stroke="#9aa9bd" stroke-width="6" stroke-linecap="round"/>
    <path d="M940 122 l-18 -12 v24 z" fill="#9aa9bd"/>

    <g transform="translate(970,0)" filter="url(#shadow)">
      <rect x="0" y="0" width="360" height="245" rx="18" fill="#ffffff"/>
      <circle cx="45" cy="48" r="24" fill="#d97706"/>
      <text x="37" y="57" class="step-num">3</text>
      <text x="86" y="58" class="step-title">연동 문제 해결</text>
      <text x="34" y="116" class="body">필드명 차이 수정</text>
      <text x="34" y="157" class="body">점수 반영 오류 해결</text>
      <text x="34" y="198" class="body">중복 문제 / SSL 보완</text>
    </g>
  </g>

  <g transform="translate(112,720)">
    <rect x="0" y="0" width="820" height="230" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="38" y="56" class="step-title">실제 개선 사례</text>
    <text x="38" y="104" class="body-small">• Unity 요청의 필드명 차이를 서버에서 함께 인식</text>
    <text x="38" y="143" class="body-small">• 훈련 종료 점수를 반영해 전투력 갱신 오류 해결</text>
    <text x="38" y="182" class="body-small">• 같은 세션에서는 이미 나온 문제를 제외하고 출제</text>
  </g>

  <g transform="translate(990,720)" filter="url(#shadow)">
    <rect x="0" y="0" width="820" height="230" rx="18" fill="url(#resultGrad)"/>
    <text x="40" y="58" class="result-title">최종 결과</text>
    <text x="40" y="107" class="result-body">문제 데이터 750개 등록 및 조회 가능</text>
    <text x="40" y="146" class="result-body">훈련 결과, 전투력, 아레나 기록 저장 가능</text>
    <text x="40" y="185" class="result-body">Unity에서 실제 배포 서버와 통신하는 구조 완성</text>
  </g>

  <text x="112" y="1015" class="small">핵심 흐름: 서버 구축 → 기능 구현 → Unity 연동 오류 수정 → 실제 플레이 가능한 배포 환경 완성</text>
</svg>
